# =============================================================
# SICAME Predictive Maintenance — Application Configuration
# =============================================================

server.port=8085



spring.application.name=sicame-backend

# ?? Database (H2 for dev) ?????????????????????????????????????
# To switch to PostgreSQL, comment H2 block and uncomment PG block
spring.datasource.url=jdbc:h2:file:./sicame_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ?? PostgreSQL (production) ???????????????????????????????????
#spring.datasource.url=jdbc:postgresql://localhost:5432/sicame
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.username=postgres
#spring.datasource.password=${DB_PASSWORD}
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ?? JPA ??????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ?? Jackson ??????????????????????????????????????????????????
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ?? Python ML service ?????????????????????????????????????????
sicame.ml.base-url=http://localhost:8765
# Connect timeout (ms)
sicame.ml.connect-timeout-ms=10000
# Read timeout ? must be > retrain time (~8s). Set to 60s.
sicame.ml.timeout-ms=60000

# ?? Data files (CSV) ?????????????????????????????????????????
# Place mh2.csv and Equipement.csv in the ./data/ folder
sicame.data.mh-csv=./data/mh2.csv
sicame.data.eq-csv=./data/Equipement.csv

# ?? CORS ?????????????????????????????????????????????????????
sicame.cors.allowed-origins=http://localhost:4200

# ?? Productivity calculation constants ????????????????????????
# Hours per shift (from SICAME PDF Annex A1)
sicame.productivity.shift-hours=8
# Fraction of rated power consumed while machine is idle/broken
sicame.productivity.idle-power-factor=0.30
# CO2 emission factor for Tunisian grid (kg CO2 per kWh)
sicame.productivity.co2-factor=0.233

# ?? Scheduler ????????????????????????????????????????????????
# Daily ML retrain at 02:00 every night
sicame.scheduler.retrain-cron=0 0 2 * * *
# ML health check interval (ms) ? every 10 minutes
sicame.scheduler.health-interval-ms=600000

# ?? Logging ??????????????????????????????????????????????????
logging.level.com.sicame=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN